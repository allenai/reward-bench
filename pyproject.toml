[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rewardbench"
version = "0.1.5"
description = "Tools for evaluating reward models"
readme = "README.md"
license = "Apache-2.0"
authors = [
    { name = "Nathan Lambert", email = "nathanl@allenai.org" },
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
]
requires-python = ">=3.10,<3.14"
dependencies = [
    "accelerate",
    "bitsandbytes",
    "datasets",
    "huggingface_hub",
    "hf_transfer",
    "pandas",
    "sentencepiece",
    "tabulate",
    "tokenizers",
    "torch",
    "torchvision",
    "torchaudio",
    "tiktoken",
    "transformers==5.17.0",
    "wandb",
]

[project.optional-dependencies]
dev = [
    "black",
    "flake8>=6.0",
    "isort>=5.12.0",
    "pytest",
]
# API-based LLM judges (fast install, no GPU required)
api = [
    "openai",
    "anthropic<2",
    "google-genai",
    "google-generativeai",
    "together",
]
# Local LLM inference via vLLM (requires Linux + CUDA, pins torch version)
# PyPI ships x86_64 and aarch64 wheels; both are built against CUDA 13.0 (as is PyPI torch 2.13)
vllm = [
    "vllm==0.31.0; sys_platform == 'linux' and (platform_machine == 'x86_64' or platform_machine == 'aarch64')",
]
# Full generative setup (API + vLLM) - backwards compatible alias
generative = [
    "rewardbench[api,vllm]",
]
# fschat (legacy v1 scripts and the --chat_template flag) is intentionally not an extra: it is unmaintained with
# unpatched advisories. Install it by hand if needed: `uv pip install fschat` (see CLAUDE.md / README).

[project.scripts]
rewardbench = "rewardbench.rewardbench:main"
rewardbench-gen = "scripts.run_generative:main"

[project.urls]
Homepage = "https://github.com/allenai/rewardbench"
Repository = "https://github.com/allenai/rewardbench"

[tool.hatch.build.targets.wheel]
packages = ["rewardbench", "scripts"]

[dependency-groups]
dev = [
    "black",
    "flake8>=6.0",
    "isort>=5.12.0",
    "pytest",
]

# vllm only ships x86_64/aarch64 Linux wheels; skip resolving exotic Linux arches (e.g. s390x, where
# vllm's protobuf pin conflicts with google-generativeai)
[tool.uv]
environments = [
    "sys_platform == 'darwin'",
    "sys_platform == 'win32'",
    "sys_platform == 'linux' and (platform_machine == 'x86_64' or platform_machine == 'aarch64')",
]

[tool.black]
line-length = 119
target-version = ["py310"]

[tool.isort]
profile = "black"
line_length = 119
