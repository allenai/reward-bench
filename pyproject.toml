[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rewardbench"
version = "0.1.5"
description = "Tools for evaluating reward models"
readme = "README.md"
license = "Apache-2.0"
authors = [
    { name = "Nathan Lambert", email = "nathanl@allenai.org" },
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
]
requires-python = ">=3.10,<3.14"
dependencies = [
    "accelerate>=1.15.0",
    "bitsandbytes",
    "datasets>=5.0.1",
    "huggingface_hub",
    "hf_transfer",
    "pandas",
    "sentencepiece",
    "tabulate",
    "tokenizers",
    "torch>=2.13.0",
    "torchvision",
    "torchaudio",
    "tiktoken",
    "transformers==5.10.4",
    "wandb",
]

[project.optional-dependencies]
dev = [
    "black>=26.3.1",
    "flake8>=6.0",
    "isort>=5.12.0",
    "pytest>=9.0.3",
]
# API-based LLM judges (fast install, no GPU required)
api = [
    "openai",
    "anthropic",
    "google-genai",
    "together",
]
# Local LLM inference via vLLM (requires Linux + CUDA, pins torch version)
vllm = [
    "vllm==0.30.0; sys_platform == 'linux' and platform_machine == 'x86_64'",
]
# Full generative setup (API + vLLM) - backwards compatible alias
generative = [
    "rewardbench[api,vllm]",
]
v1 = [
    "trl>=0.8.2",  # needed for DPO scripts and value-head models
]

[project.scripts]
rewardbench = "rewardbench.rewardbench:main"
rewardbench-gen = "scripts.run_generative:main"

[project.urls]
Homepage = "https://github.com/allenai/rewardbench"
Repository = "https://github.com/allenai/rewardbench"

[tool.hatch.build.targets.wheel]
packages = ["rewardbench", "scripts"]

[dependency-groups]
dev = [
    "black>=26.3.1",
    "flake8>=6.0",
    "isort>=5.12.0",
    "pytest>=9.0.3",
]

# Security floors for transitive dependencies. These do not install unused extras.
[tool.uv]
constraint-dependencies = [
    "aiohttp>=3.14.3",
    "anyio>=4.14.2",
    "cbor2>=5.9.0",
    "cryptography>=50.0.0",
    "gitpython>=3.1.59",
    "httplib2>=0.32.0",
    "idna>=3.15",
    "mcp>=1.28.1",
    "msgpack>=1.2.1",
    "pillow>=12.3.0",
    "protobuf>=5.29.6",
    "pyarrow>=23.0.1",
    "pyasn1>=0.6.4",
    "pydantic-settings>=2.14.2",
    "pygments>=2.20.0",
    "pyjwt>=2.13.0",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.31",
    "ray>=2.56.0",
    "requests>=2.33.0",
    "starlette>=1.3.1",
    "urllib3>=2.7.0",
    "xgrammar>=0.1.32",
]

# DGX Spark (aarch64 + CUDA 13) support
# PyTorch cu130 wheels for Blackwell GPU
[tool.uv.sources]
torch = [
  { index = "pytorch-cu130", marker = "platform_system == 'Linux' and platform_machine == 'aarch64'" },
]
torchvision = [
  { index = "pytorch-cu130", marker = "platform_system == 'Linux' and platform_machine == 'aarch64'" },
]
torchaudio = [
  { index = "pytorch-cu130", marker = "platform_system == 'Linux' and platform_machine == 'aarch64'" },
]
vllm = [
  { index = "vllm-cu130", marker = "platform_system == 'Linux' and platform_machine == 'aarch64'" },
]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[[tool.uv.index]]
name = "vllm-cu130"
url = "https://wheels.vllm.ai/nightly/cu130"
explicit = true

[tool.black]
line-length = 119
target-version = ["py310"]

[tool.isort]
profile = "black"
line_length = 119
